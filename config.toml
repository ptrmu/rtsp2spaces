# Shared by development and the Pi. Relative paths resolve against this file.
data_dir = "data"
tasks = ["MazamaStakeCan", "MazamaRanchCam", "ChechaquoTemp"]

[cameras.MazamaStakeCan]
source = "https"
crop = "center_square"
host = "192.168.1.25"
channel = 1
timeout_seconds = 15
# Opt in only for the camera's self-signed certificate.
accept_invalid_certs = true

[cameras.MazamaRanchCam]
source = "reolink_uid"
channel = 0
crop = "none"
timeout_seconds = 60

[temperature]
source = "ambient"
mac_address = "94:3C:C6:45:02:5F"
timeout_seconds = 15
sampling_interval_minutes = 5
