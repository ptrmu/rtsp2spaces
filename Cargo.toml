[package]
name = "stakecam"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4.35"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
neolink_core = { git = "https://github.com/ptrmu/neolink.git", rev = "621a929eaac215a7d3746a6f2b41fd4f3d85371c" }
